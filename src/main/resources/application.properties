spring.application.name=prestamos
server.port=8080

# --- PostgreSQL (ajusta usuario y clave) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/prestamos_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- JPA ---
# "validate" comprueba que las tablas creadas con schema.sql coincidan con las entidades.
# Si prefieres que Hibernate las cree solas, cambia a "update".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Swagger ---
springdoc.swagger-ui.path=/swagger-ui.html
